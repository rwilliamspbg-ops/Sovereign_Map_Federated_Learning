name: AV Ingestion Go Tests

"on":
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'sensors/mobile/**'
      - 'sensors/drone/**'
      - '.github/workflows/av-ingestion-go-tests.yml'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [ main ]
    paths:
      - 'sensors/mobile/**'
      - 'sensors/drone/**'
      - '.github/workflows/av-ingestion-go-tests.yml'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  av-ingestion-tests:
    name: AV Ingestion Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Run mobile and drone ingestion tests
        run: |
          bash scripts/go-with-aligned-toolchain.sh test -v ./sensors/mobile ./sensors/drone
