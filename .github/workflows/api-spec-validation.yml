name: API Spec Validation

on:
  pull_request:
    paths:
      - "docs/api/**"
      - "scripts/validate-api-coverage.js"
      - "sovereignmap_production_backend_v2.py"
      - "scripts/tokenomics_metrics_exporter.py"
      - "scripts/tpm_metrics_exporter.py"
      - "packages/training/api.py"
      - "package.json"
      - ".github/workflows/api-spec-validation.yml"
  push:
    branches: [main]
    paths:
      - "docs/api/**"
      - "scripts/validate-api-coverage.js"
      - "sovereignmap_production_backend_v2.py"
      - "scripts/tokenomics_metrics_exporter.py"
      - "scripts/tpm_metrics_exporter.py"
      - "packages/training/api.py"
      - "package.json"
      - ".github/workflows/api-spec-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Validate API route coverage
        run: npm run api:validate

      - name: Validate Postman collection JSON
        run: node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('docs/api/postman_collection.json','utf8')); console.log('postman_collection.json is valid')"
