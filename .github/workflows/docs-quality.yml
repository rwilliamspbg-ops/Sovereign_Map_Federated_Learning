name: Docs Quality

on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "Documentation/**"
      - ".markdownlint-docs.json"
      - "scripts/check_markdown_links_subset.py"
      - ".github/workflows/docs-quality.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "Documentation/**"
      - ".markdownlint-docs.json"
      - "scripts/check_markdown_links_subset.py"
      - ".github/workflows/docs-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-lint-and-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Markdown lint (targeted files)
        run: |
          npx --yes markdownlint-cli2 \
            --config .markdownlint-docs.json \
            README.md \
            CONTRIBUTING.md \
            docs/README.md \
            Documentation/README.md \
            docs/DOCUMENTATION_MAINTENANCE.md \
            docs/index.md \
            Documentation/Project/REPO_SETTINGS_ADMIN_RUNBOOK.md

      - name: Local markdown link check (targeted files)
        run: |
          python scripts/check_markdown_links_subset.py \
            README.md \
            CONTRIBUTING.md \
            docs/README.md \
            Documentation/README.md \
            docs/DOCUMENTATION_MAINTENANCE.md \
            docs/index.md \
            Documentation/Project/REPO_SETTINGS_ADMIN_RUNBOOK.md
