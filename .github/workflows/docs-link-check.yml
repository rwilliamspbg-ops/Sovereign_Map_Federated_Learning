name: Docs Link Check

on:
  pull_request:
    paths:
      - "Documentation/**"
      - "documentation/**"
      - ".github/**/*.md"
      - "scripts/check_active_doc_links.py"
  push:
    branches: [main]
    paths:
      - "Documentation/**"
      - "documentation/**"
      - ".github/**/*.md"
      - "scripts/check_active_doc_links.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-doc-link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate active documentation links
        run: python scripts/check_active_doc_links.py
