name: FedAvg Benchmark Compare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fedavg-benchmark-compare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fedavg-benchmark-compare:
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run FedAvg benchmark comparison
        run: |
          chmod +x scripts/benchmark_fedavg_compare.sh

          BASE="origin/main"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          fi

          git fetch origin "${BASE#origin/}" --depth=1 || true

          BASE_REF="$BASE" \
          BENCH_CLIENTS="100 500 1000" \
          BENCH_RUNS="2" \
          REPORT_PATH="results/metrics/fedavg_benchmark_compare.md" \
          ./scripts/benchmark_fedavg_compare.sh

      - name: Upload FedAvg benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: fedavg-benchmark-report
          path: results/metrics/fedavg_benchmark_compare.md
